<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision Compass</title>
<meta name="description" content="A GCSE progress tracker: map every subject, topic and sub-topic, track mastery, and log real test results.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #f4f6f4; --card: #ffffff; --card-2: #eef1ee;
    --ink: #1a2521; --ink-soft: #465049; --ink-faint: #6f7a73;
    --line: #dbe1dc; --line-strong: #c4ccc5;
    --accent: #1f6b57; --accent-soft: #e3efe9; --accent-ink: #124535;
    --r: #c14a3c; --r-bg: #f7e2de; --a: #c98a1a; --a-bg: #f7ecd6;
    --g: #2f8f5b; --g-bg: #dcefe1; --b: #2f6d8f; --b-bg: #dbe9f0;
    --shadow: 0 1px 2px rgba(20,40,30,.05), 0 6px 20px rgba(20,40,30,.06);
    --danger: #c14a3c;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #12160f; --card: #1a1f18; --card-2: #222820;
      --ink: #e8ede6; --ink-soft: #b3bcb3; --ink-faint: #838d83;
      --line: #2b322a; --line-strong: #3a423a;
      --accent: #5cbf9d; --accent-soft: #1d3129; --accent-ink: #bfe8d8;
      --r: #e07a6c; --r-bg: #3a2320; --a: #e0b05a; --a-bg: #362c17;
      --g: #5fc082; --g-bg: #1c3325; --b: #6cb2d6; --b-bg: #17303b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --danger: #e07a6c;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12160f; --card: #1a1f18; --card-2: #222820;
    --ink: #e8ede6; --ink-soft: #b3bcb3; --ink-faint: #838d83;
    --line: #2b322a; --line-strong: #3a423a;
    --accent: #5cbf9d; --accent-soft: #1d3129; --accent-ink: #bfe8d8;
    --r: #e07a6c; --r-bg: #3a2320; --a: #e0b05a; --a-bg: #362c17;
    --g: #5fc082; --g-bg: #1c3325; --b: #6cb2d6; --b-bg: #17303b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --danger: #e07a6c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  h1,h2,h3,h4 { font-family: "Spectral", Georgia, serif; font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  /* Top bar */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; max-width: 960px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .compass { width: 28px; height: 28px; flex: none; border: 2px solid var(--accent); border-radius: 50%; position: relative; background: var(--accent-soft); }
  .compass::before { content: ""; position: absolute; inset: 0; margin: auto; width: 2px; height: 16px; background: var(--accent); transform: rotate(38deg); border-radius: 2px; }
  .compass::after { content: ""; position: absolute; inset: 0; margin: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .brand b { font-family: "Spectral", serif; font-size: 1.02rem; }
  .brand small { display: block; font-family: "IBM Plex Sans"; font-size: .72rem; color: var(--ink-faint); font-weight: 400; margin-top: -2px; }
  .spacer { flex: 1; }
  .icon-btn { background: var(--card-2); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 1rem; display: grid; place-items: center; }
  .icon-btn:hover { border-color: var(--line-strong); }

  /* Tabs */
  nav.tabs { display: flex; gap: 4px; padding: 0 20px; max-width: 960px; margin: 0 auto; }
  nav.tabs button {
    background: none; border: none; cursor: pointer; padding: 12px 14px; color: var(--ink-faint);
    font-size: .92rem; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs button:hover { color: var(--ink); }

  main { padding: 26px 0 80px; }
  .view-head { margin-bottom: 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .view-head h2 { font-size: 1.5rem; }
  .view-head p { margin: 4px 0 0; color: var(--ink-faint); font-size: .9rem; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border-radius: 9px; padding: 9px 14px; font-size: .88rem; font-weight: 600; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary { color: #08120d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #08120d; } }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.sm { padding: 5px 10px; font-size: .8rem; border-radius: 7px; }
  .btn.ghost { background: none; border-color: transparent; color: var(--ink-faint); }
  .btn.ghost:hover { background: var(--card-2); border-color: var(--line); }

  /* Cards & grids */
  .grid { display: grid; gap: 16px; }
  .g-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .pad { padding: 18px 20px; }

  /* Stat tiles */
  .stat { padding: 18px 20px; }
  .stat .k { font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); }
  .stat .v { font-family: "Spectral", serif; font-size: 2rem; font-weight: 700; margin-top: 4px; line-height: 1; }
  .stat .sub { font-size: .8rem; color: var(--ink-soft); margin-top: 6px; }

  /* Ring */
  .ring { width: 56px; height: 56px; flex: none; border-radius: 50%; display: grid; place-items: center; }
  .ring i { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-style: normal; font-weight: 700; font-family: "IBM Plex Mono", monospace; font-size: .84rem; }

  /* Subject rows */
  .subj { border-bottom: 1px solid var(--line); }
  .subj:last-child { border-bottom: none; }
  .subj-btn { width: 100%; text-align: left; background: none; border: none; cursor: pointer; padding: 15px 20px; display: flex; align-items: center; gap: 14px; color: inherit; font-family: inherit; }
  .subj-btn:hover { background: var(--card-2); }
  .chev { transition: transform .2s; color: var(--ink-faint); font-size: .72rem; flex: none; }
  .subj-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .subj-name { font-weight: 600; font-size: .98rem; }
  .subj-meta { font-size: .76rem; color: var(--ink-faint); }
  .bar { height: 8px; border-radius: 6px; background: var(--card-2); overflow: hidden; width: 130px; flex: none; }
  .bar i { display: block; height: 100%; border-radius: 6px; transition: width .3s; }
  .pct { font-family: "IBM Plex Mono", monospace; font-size: .82rem; color: var(--ink-soft); width: 40px; text-align: right; flex: none; }

  .topics { padding: 2px 20px 14px; }
  .topic { padding: 10px 0; border-top: 1px dashed var(--line); }
  .topic:first-child { border-top: none; }
  .topic-head { display: flex; align-items: center; gap: 10px; }
  .topic-head .tn { flex: 1; font-size: .92rem; font-weight: 500; }
  .subs { margin: 8px 0 2px; padding-left: 4px; display: grid; gap: 7px; }
  .sub-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sub-row .sn { flex: 1; min-width: 140px; font-size: .86rem; color: var(--ink-soft); }

  .chip { font-family: "IBM Plex Mono", monospace; font-size: .66rem; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; font-weight: 600; flex: none; white-space: nowrap; }
  .chip.r { background: var(--r-bg); color: var(--r); } .chip.a { background: var(--a-bg); color: var(--a); }
  .chip.g { background: var(--g-bg); color: var(--g); } .chip.b { background: var(--b-bg); color: var(--b); }
  .chip.grade { background: var(--accent-soft); color: var(--accent-ink); }

  /* RAG selector */
  .rag { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rag button { border: none; background: var(--card); color: var(--ink-faint); cursor: pointer; padding: 4px 9px; font-size: .68rem; font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .03em; border-left: 1px solid var(--line); }
  .rag button:first-child { border-left: none; }
  .rag button[aria-pressed="true"].vr { background: var(--r-bg); color: var(--r); }
  .rag button[aria-pressed="true"].va { background: var(--a-bg); color: var(--a); }
  .rag button[aria-pressed="true"].vg { background: var(--g-bg); color: var(--g); }
  .rag button[aria-pressed="true"].vb { background: var(--b-bg); color: var(--b); }
  .rag button:hover { color: var(--ink); }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: .78rem; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }

  .attention li { list-style: none; }
  ul.attention { margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.attention li { display: flex; align-items: center; gap: 10px; font-size: .88rem; padding: 8px 12px; background: var(--card-2); border-radius: 9px; }
  ul.attention .where { color: var(--ink-faint); font-size: .8rem; }

  /* Tests */
  .test-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .test-row:first-child { border-top: none; }
  .test-row .ti { flex: 1; }
  .test-row .tt { font-weight: 600; font-size: .92rem; }
  .test-row .td { font-size: .78rem; color: var(--ink-faint); }
  .score-pill { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: .95rem; }

  .spark { display: flex; align-items: flex-end; gap: 4px; height: 40px; }
  .spark b { display: block; width: 10px; border-radius: 3px 3px 0 0; background: var(--accent); opacity: .8; }

  .empty { text-align: center; color: var(--ink-faint); padding: 40px 20px; font-size: .9rem; }
  .empty .big { font-size: 1.6rem; margin-bottom: 8px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(10,20,15,.5); display: grid; place-items: center; padding: 20px; z-index: 50; }
  .modal { background: var(--card); border: 1px solid var(--line-strong); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; }
  .modal h3 { font-size: 1.2rem; margin-bottom: 4px; }
  .modal .m-body { padding: 22px; }
  .modal .m-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--card); }
  label.f { display: block; margin-top: 14px; }
  label.f span { display: block; font-size: .78rem; color: var(--ink-soft); margin-bottom: 5px; font-weight: 500; }
  input, select, textarea { width: 100%; font-family: inherit; font-size: .92rem; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: .76rem; color: var(--ink-faint); margin-top: 6px; }
  .checks { display: grid; gap: 6px; margin-top: 6px; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: .86rem; }
  .checks input { width: auto; }

  .del { color: var(--danger); }
  .muted { color: var(--ink-faint); }
  .foot-note { text-align: center; color: var(--ink-faint); font-size: .78rem; margin-top: 30px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 560px) {
    .bar { width: 84px; }
    .subj-meta { display: none; }
    .row2 { grid-template-columns: 1fr; }
  }

  /* Sync status + auth */
  .sync { font-family: "IBM Plex Mono", monospace; font-size: .72rem; font-weight: 500; padding: 0 4px; white-space: nowrap; }
  .auth-wrap { max-width: 420px; margin: 6vh auto 0; }
  .auth-card { padding: 34px 30px 30px; text-align: center; }
  .auth-badge { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); display: grid; place-items: center; margin: 0 auto 18px; }
  .auth-badge .compass { width: 30px; height: 30px; }
  .auth-title { font-size: 1.4rem; margin-bottom: 6px; }
  .auth-sub { color: var(--ink-soft); font-size: .92rem; margin: 0 auto 18px; max-width: 34ch; }
  .auth-form { text-align: left; }
  .auth-form label.f { margin-top: 12px; }
  .auth-msg { font-size: .84rem; margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; background: var(--card-2); }
  .auth-alt { margin-top: 16px; font-size: .8rem; color: var(--ink-faint); text-align: center; }

  /* Collapsible / draggable subject cards */
  .drag-handle { cursor: grab; color: var(--ink-faint); font-size: 1.05rem; line-height: 1; padding: 2px; user-select: none; flex: none; }
  .drag-handle:active { cursor: grabbing; }
  .collapse-chevron { background: none; border: none; cursor: pointer; color: var(--ink-faint); font-size: .72rem; padding: 4px; transition: transform .2s; flex: none; }
  .collapse-chevron.open { transform: rotate(90deg); }
  .subj-card.dragover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .subj-card [disabled] { opacity: .35; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="compass" aria-hidden="true"></div>
      <div><b>Revision Compass</b><small id="studentLine">GCSE progress</small></div>
    </div>
    <div class="spacer"></div>
    <span class="sync" id="syncStatus" hidden></span>
    <button class="btn sm" id="editStudent" title="Edit profile &amp; target grades" hidden>Profile</button>
    <button class="btn sm ghost" id="signOutBtn" title="Sign out" hidden>Sign out</button>
    <button class="icon-btn" id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </div>
  <nav class="tabs" id="appNav" role="tablist" hidden>
    <button role="tab" aria-selected="true" data-view="dashboard">Dashboard</button>
    <button role="tab" aria-selected="false" data-view="subjects">Subjects</button>
    <button role="tab" aria-selected="false" data-view="tests">Tests</button>
    <button role="tab" aria-selected="false" data-view="practise">Practise</button>
  </nav>
</header>

<main>
  <div class="wrap" id="app"></div>
</main>

<div id="modalRoot"></div>

<script>
"use strict";

/* ---------------- Backend (Supabase) + storage ---------------- */
var SUPABASE_URL = "https://zusfwsamcsjorkwficvk.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1c2Z3c2FtY3Nqb3Jrd2ZpY3ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTI4MDQsImV4cCI6MjEwMzg2ODgwNH0.vjgON9P45hXvuDcHwgGPLww6zRTi8nTx6scX9Z8tL14";
var sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

var KEY = "revisionCompass.v1";   // legacy Phase-1 key (used once for migration)
var state = null;
var userId = null;
var authedId = null;
var cloudTimer = null;

function uid() { return Math.random().toString(36).slice(2, 9); }

/* Per-user local cache — an offline copy so the app opens instantly and
   survives a dropped connection; the cloud row is the source of truth. */
function cacheKey() { return KEY + ".cache." + (userId || "anon"); }
function writeCache() { try { localStorage.setItem(cacheKey(), JSON.stringify(state)); } catch (e) {} }
function readCache() { try { var r = localStorage.getItem(cacheKey()); if (r) return JSON.parse(r); } catch (e) {} return null; }

function setSync(s) {
  var elx = document.getElementById("syncStatus");
  if (!elx) return;
  var map = { saving: ["Saving…", "var(--a)"], synced: ["✓ Synced", "var(--g)"],
              offline: ["⚠ Offline", "var(--r)"], "": ["", "var(--ink-faint)"] };
  var m = map[s] || map[""];
  elx.textContent = m[0]; elx.style.color = m[1];
}

/* Called throughout the app after any change. */
function save() {
  writeCache();
  scheduleCloudSave();
}
function scheduleCloudSave() {
  if (!userId || !sb) return;
  setSync("saving");
  if (cloudTimer) clearTimeout(cloudTimer);
  cloudTimer = setTimeout(pushCloud, 700);
}
function pushCloud() {
  if (!userId || !sb) return;
  sb.from("app_state").upsert({ user_id: userId, data: state }, { onConflict: "user_id" })
    .then(function (res) { setSync(res && res.error ? "offline" : "synced"); })
    .catch(function () { setSync("offline"); });
}

/* ---------------- Seed data ---------------- */
function seed() {
  function st(name, conf, qs) { return { id: uid(), name: name, stage: "none", status: null, confidence: 0, questions: qs || [], attempts: [] }; }
  function tp(name, subs) { return { id: uid(), name: name, subtopics: subs }; }
  function mc(p, opts, ai) { return { id: uid(), type: "mc", q: p, options: opts, answer: ai }; }
  function sa(p, ans) { return { id: uid(), type: "short", q: p, answer: ans }; }
  return {
    student: { name: "Sample Student", year: "Year 11", season: "Summer 2026" },
    subjects: [
      { id: uid(), name: "Mathematics", board: "Edexcel", target: "6", topics: [
        tp("Number", [ st("Surds & indices", 90, [
            mc("Simplify √50", ["5√2", "2√5", "10√5", "25√2"], 0),
            mc("Evaluate 3⁻²", ["-9", "-6", "1/9", "6"], 2),
            sa("Simplify √8 in the form a√2. What is a?", "2")
          ]), st("Standard form", 78), st("Fractions & percentages", 72) ]),
        tp("Algebra", [ st("Solving quadratics", 75), st("Simultaneous equations", 60), st("Sequences", 55) ]),
        tp("Ratio & proportion", [ st("Direct & inverse proportion", 48), st("Compound measures", 52) ]),
        tp("Geometry & measures", [ st("Circle theorems", 30, [
            mc("The angle in a semicircle is…", ["45°", "60°", "90°", "180°"], 2),
            mc("The angle at the centre is ___ the angle at the circumference on the same arc.", ["equal to", "half", "twice", "three times"], 2)
          ]), st("Trigonometry", 42), st("Vectors", 25) ]),
        tp("Probability & statistics", [ st("Tree diagrams", 68), st("Cumulative frequency", 70) ])
      ]},
      { id: uid(), name: "Combined Science — Biology", board: "AQA", target: "5", topics: [
        tp("Cell biology", [ st("Cell structure", 80), st("Transport in cells", 72) ]),
        tp("Infection & response", [ st("Communicable diseases", 55), st("The immune system", 50) ]),
        tp("Bioenergetics", [ st("Photosynthesis", 38), st("Respiration", 32, [
            mc("Aerobic respiration mainly takes place in the…", ["nucleus", "mitochondria", "ribosome", "cell wall"], 1),
            sa("Which acid builds up during anaerobic respiration in muscle cells?", "lactic acid")
          ]) ]),
        tp("Homeostasis & response", [ st("The nervous system", 28), st("Hormones", 40) ])
      ]},
      { id: uid(), name: "English Literature", board: "AQA", target: "6", topics: [
        tp("Shakespeare — Macbeth", [ st("Themes & context", 76), st("Key quotations", 70, [
            sa('"Is this a ___ which I see before me?" (one word)', "dagger"),
            mc("“Out, damned spot!” is spoken by…", ["Macbeth", "Lady Macbeth", "Banquo", "Macduff"], 1)
          ]) ]),
        tp("19th-century novel — A Christmas Carol", [ st("Scrooge's arc", 74), st("Structure & morality", 66) ]),
        tp("Modern text — An Inspector Calls", [ st("Social responsibility", 36), st("Characters", 44) ]),
        tp("Poetry — Power & Conflict", [ st("Comparing poems", 52), st("Unseen poetry", 48) ])
      ]}
    ],
    tests: [
      { id: uid(), subjectId: null, name: "Autumn mock — Paper 1", date: "2025-11-14", pct: 58, grade: "5", topicIds: [], note: "Whole-paper mock" }
    ]
  };
}
/* attach a couple of realistic tests to seeded subjects */

/* Find a curriculum by subject name — exact alias first, then substring. */
function findCurriculum(name) {
  var n = normalize(name);
  if (!n) return null;
  for (var i = 0; i < CURRICULA.length; i++) {
    for (var j = 0; j < CURRICULA[i].aliases.length; j++) {
      if (n === normalize(CURRICULA[i].aliases[j])) return CURRICULA[i];
    }
  }
  for (var a = 0; a < CURRICULA.length; a++) {
    for (var b = 0; b < CURRICULA[a].aliases.length; b++) {
      var al = normalize(CURRICULA[a].aliases[b]);
      if (al.length >= 4 && n.indexOf(al) >= 0) return CURRICULA[a];
    }
  }
  return null;
}
/* Build fresh topic objects from a curriculum entry. */
function curriculumTopics(c) {
  return c.topics.map(function (t) {
    return { id: uid(), name: t[0], subtopics: t[1].map(function (sn) {
      return { id: uid(), name: sn, stage: "none", status: null, confidence: 0, questions: [], attempts: [] };
    }) };
  });
}

/* ---------------- Scoring ---------------- */
/* Mastery bands */
function band(score) {
  if (score >= 85) return { key: "b", label: "Mastered", color: "var(--b)" };
  if (score >= 65) return { key: "g", label: "Secure", color: "var(--g)" };
  if (score >= 40) return { key: "a", label: "Learning", color: "var(--a)" };
  return { key: "r", label: "Weak", color: "var(--r)" };
}

/* Recency-weighted average test % for a given topic in a subject.
   Tests tagged to the topic count fully; whole-subject tests (no topicIds) count at lower weight. */
function testEvidenceForTopic(subject, topicId) {
  var rel = state.tests.filter(function (t) {
    return t.subjectId === subject.id && typeof t.pct === "number" &&
      (t.topicIds.indexOf(topicId) >= 0 || t.topicIds.length === 0);
  });
  if (!rel.length) return null;
  rel.sort(function (a, b) { return (a.date < b.date ? -1 : 1); });
  var wsum = 0, vsum = 0;
  rel.forEach(function (t, i) {
    var recency = (i + 1);                                   // later tests weigh more
    var tagged = t.topicIds.indexOf(topicId) >= 0 ? 1 : 0.4; // whole-subject tests count less
    var w = recency * tagged;
    wsum += w; vsum += w * t.pct;
  });
  return wsum ? vsum / wsum : null;
}

/* Recency-weighted quiz score (0-100) for a sub-topic, from its attempt log. */
function subtopicQuizScore(st) {
  var a = st.attempts || [];
  if (!a.length) return null;
  var recent = a.slice(-12);
  var wsum = 0, vsum = 0;
  recent.forEach(function (att, i) { var w = i + 1; wsum += w; vsum += w * (att.c ? 100 : 0); });
  return wsum ? vsum / wsum : null;
}
/* A sub-topic's working score: self-rating, refined by app-quiz evidence. */
function subtopicScore(st) {
  var q = subtopicQuizScore(st);
  if (q === null) return st.confidence;
  return Math.round(st.confidence * 0.4 + q * 0.6);
}
function topicSelfScore(topic) {
  if (!topic.subtopics.length) return 0;
  var sum = topic.subtopics.reduce(function (a, s) { return a + subtopicScore(s); }, 0);
  return sum / topic.subtopics.length;
}

/* Final topic mastery: blend self-rating with real test evidence (tests weigh more). */
function topicMastery(subject, topic) {
  var self = topicSelfScore(topic);
  var ev = testEvidenceForTopic(subject, topic.id);
  if (ev === null) return self;
  return Math.round(self * 0.35 + ev * 0.65);
}
function subjectMastery(subject) {
  if (!subject.topics.length) return 0;
  var sum = subject.topics.reduce(function (a, t) { return a + topicMastery(subject, t); }, 0);
  return Math.round(sum / subject.topics.length);
}
function overallMastery() {
  if (!state.subjects.length) return 0;
  var sum = state.subjects.reduce(function (a, s) { return a + subjectMastery(s); }, 0);
  return Math.round(sum / state.subjects.length);
}
/* Rough predicted 9–1 grade from mastery, for the dashboard headline. */
function predictedGrade(mastery) {
  if (mastery >= 88) return "8–9";
  if (mastery >= 78) return "7";
  if (mastery >= 68) return "6";
  if (mastery >= 55) return "5";
  if (mastery >= 42) return "4";
  if (mastery >= 30) return "3";
  return "1–2";
}

/* Collapse state (per-device UI preference) + reorder helpers */
var dragSubjectId = null;
function collapsedKey() { return KEY + ".collapsed." + (userId || "anon"); }
function collapsedMap() { try { return JSON.parse(localStorage.getItem(collapsedKey()) || "{}"); } catch (e) { return {}; } }
function isCollapsed(id) { return !!collapsedMap()[id]; }
function setCollapsed(id, val) { var o = collapsedMap(); if (val) o[id] = 1; else delete o[id]; try { localStorage.setItem(collapsedKey(), JSON.stringify(o)); } catch (e) {} }
function setAllCollapsed(val) { var o = {}; if (val) state.subjects.forEach(function (s) { o[s.id] = 1; }); try { localStorage.setItem(collapsedKey(), JSON.stringify(o)); } catch (e) {} }
function anyExpanded() { for (var i = 0; i < state.subjects.length; i++) { if (!isCollapsed(state.subjects[i].id)) return true; } return false; }
function reorderSubjects(fromId, toId) {
  if (fromId === toId) return;
  var arr = state.subjects, from = -1, to = 0, i;
  for (i = 0; i < arr.length; i++) if (arr[i].id === fromId) { from = i; break; }
  if (from < 0) return;
  var item = arr.splice(from, 1)[0];
  for (i = 0; i < arr.length; i++) if (arr[i].id === toId) { to = i; break; }
  arr.splice(to, 0, item);
  save(); render();
}

/* Sub-topic progress: stage (none/learning/completed) + status (weak/secure/mastered).
   Backed by the numeric `confidence` (0-100) the scoring model already uses. */
function stageStatusToConf(stage, status) {
  if (stage === "none") return 0;
  var base = stage === "completed" ? { weak: 60, secure: 78, mastered: 95 } : { weak: 20, secure: 35, mastered: 50 };
  return base[status] || base.secure;
}
function deriveStageStatus(st) {
  if (st.stage) return { stage: st.stage, status: st.status || "weak" };
  var c = st.confidence || 0;
  if (c <= 0) return { stage: "none", status: "weak" };
  if (c < 28) return { stage: "learning", status: "weak" };
  if (c < 43) return { stage: "learning", status: "secure" };
  if (c < 55) return { stage: "learning", status: "mastered" };
  if (c < 69) return { stage: "completed", status: "weak" };
  if (c < 87) return { stage: "completed", status: "secure" };
  return { stage: "completed", status: "mastered" };
}
function setStageStatus(st, stage, status) {
  st.stage = stage;
  st.status = stage === "none" ? null : (status || "weak");
  st.confidence = stageStatusToConf(stage, st.status);
  save(); render();
}
/* One-off tidy: earlier auto-filled sub-topics defaulted to 40 ("Learning");
   with no explicit stage set, reset those to "Not started yet". */
function normalizeState() {
  var changed = 0;
  if (!state || !state.subjects) return false;
  state.subjects.forEach(function (s) {
    (s.topics || []).forEach(function (t) {
      (t.subtopics || []).forEach(function (st) {
        if (!st.stage && st.confidence === 40) { st.stage = "none"; st.status = null; st.confidence = 0; changed++; }
        if (!st.questions) st.questions = [];
        if (!st.attempts) st.attempts = [];
      });
    });
  });
  return changed > 0;
}
/* Set every sub-topic back to "Not started yet", keeping structure, questions and tests. */
function resetAllProgress() {
  state.subjects.forEach(function (s) {
    (s.topics || []).forEach(function (t) {
      (t.subtopics || []).forEach(function (st) { st.stage = "none"; st.status = null; st.confidence = 0; });
    });
  });
  save(); render();
}

/* ---------------- Practise (quiz engine) ---------------- */
var quiz = null;        // active quiz session
var quizResult = null;  // last quiz summary

function normalize(s) { return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* Flatten all questions in scope, each tagged with its sub-topic + context. */
function allQuestions(scopeSubjectId) {
  var out = [];
  state.subjects.forEach(function (s) {
    if (scopeSubjectId && s.id !== scopeSubjectId) return;
    s.topics.forEach(function (t) {
      t.subtopics.forEach(function (st) {
        (st.questions || []).forEach(function (q) {
          out.push({ q: q, st: st, topicName: t.name, subjectName: s.name });
        });
      });
    });
  });
  return out;
}

/* Choose n questions. Smart mode over-samples weak / rarely-practised sub-topics. */
function pickQuestions(pool, n, smart) {
  if (!smart) return shuffle(pool.slice()).slice(0, n);
  var weighted = [];
  pool.forEach(function (item) {
    var score = subtopicScore(item.st);
    var tries = (item.st.attempts || []).length;
    var weight = (100 - score) + 20 + Math.max(0, 8 - tries) * 5;  // weakness + novelty + floor
    var copies = Math.max(1, Math.round(weight / 15));
    for (var i = 0; i < copies; i++) weighted.push(item);
  });
  shuffle(weighted);
  var seen = {}, chosen = [];
  for (var k = 0; k < weighted.length && chosen.length < n; k++) {
    var it = weighted[k];
    if (seen[it.q.id]) continue;
    seen[it.q.id] = 1; chosen.push(it);
  }
  return chosen;
}

function renderPractise(root) {
  root.appendChild(el('<div class="view-head"><div>' +
    '<span class="eyebrow">Test his knowledge</span>' +

  if (quiz) { renderQuizRunner(root); return; }

  if (hasSubtopics) {

    wc.appendChild(el('<p class="hint" style="margin:4px 0 10px;color:var(--accent-ink)">Generate AI questions aimed at the sub-topics he scores lowest on — using his quiz results and the questions he has got wrong.</p>'));
    var wb = el('<button class="btn primary sm">Generate for weakest areas</button>');
    wb.addEventListener("click", generateWeakSpots);
    wc.appendChild(wb);
    root.appendChild(wc);
  }

  var total = allQuestions(null).length;
  if (!total) {
    root.appendChild(el('<div class="card"><div class="empty"><div class="big">🧠</div>' +
      'No practice questions yet.<br>Add some via the <b>Qs</b> button on any sub-topic in the ' +
      '<b>Subjects</b> tab — or use <b>Profile → Reset all data to sample</b> to load a few starter questions.' +
      '</div></div>'));
    return;
  }

  var card = el('<div class="card pad"></div>');
  card.appendChild(el('<h3 style="font-size:1.05rem;margin-bottom:14px">Start a quiz</h3>'));

  var focusL = el('<label class="f"><span>Focus</span></label>');

  });
  focusL.appendChild(scopeSel);

  var lenL = el('<label class="f"><span>Length</span></label>');

function renderQuizRunner(root) {
  var item = quiz.items[quiz.i];
  var q = item.q;
  var card = el('<div class="card pad"></div>');

  var top = el('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"></div>');
  top.appendChild(el('<span class="muted" style="font-size:.82rem">Question ' + (quiz.i + 1) + ' of ' + quiz.items.length + '</span>'));
  var quitB = el('<button class="btn sm ghost">End quiz</button>');
  quitB.addEventListener("click", finishQuiz);
  top.appendChild(quitB);
  card.appendChild(top);

  var barw = el('<div class="bar" style="width:100%;margin-bottom:18px"></div>');
  barw.appendChild(el('<i style="width:' + Math.round(quiz.i / quiz.items.length * 100) + '%;background:var(--accent)"></i>'));
  card.appendChild(barw);

  card.appendChild(el('<div class="muted" style="font-size:.76rem;margin-bottom:4px">' + esc(item.subjectName) + ' · ' + esc(item.topicName) + '</div>'));
  card.appendChild(el('<h3 style="font-size:1.18rem;margin-bottom:16px">' + esc(q.q) + '</h3>'));

  var ans = quiz.current;   // set once answered
  var body = el('<div></div>');
  card.appendChild(body);

  if (q.type === "mc") {
    q.options.forEach(function (opt, idx) {
      var b = el('<button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:8px"></button>');
      b.textContent = opt;
      if (ans) {
        b.disabled = true;
        if (idx === q.answer) b.style.borderColor = "var(--g)";
        if (idx === ans.chosen && !ans.correct) b.style.borderColor = "var(--r)";
      } else {
        b.addEventListener("click", function () { answerQuiz(idx === q.answer, idx, null); });
      }
      body.appendChild(b);
    });
  } else {
    var wrap = el('<div style="display:flex;gap:8px"></div>');
    var inp = el('<input placeholder="Type your answer" autocomplete="off">');
    wrap.appendChild(inp);
    var check = el('<button class="btn primary" style="flex:none">Check</button>');
    if (ans) { inp.value = ans.text || ""; inp.disabled = true; }
    else {
      var submit = function () { var v = inp.value.trim(); if (!v) return; answerQuiz(normalize(v) === normalize(q.answer), null, v); };
      check.addEventListener("click", submit);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      wrap.appendChild(check);
    }
    body.appendChild(wrap);
  }

  if (ans) {
    var fb = el('<div class="auth-msg" style="margin-top:16px"></div>');
    if (ans.correct) { fb.textContent = "✓ Correct"; fb.style.color = "var(--g)"; }
    else { fb.textContent = "✗ Not quite — correct answer: " + (q.type === "mc" ? q.options[q.answer] : q.answer); fb.style.color = "var(--r)"; }
    card.appendChild(fb);
    var last = quiz.i + 1 >= quiz.items.length;
    var next = el('<button class="btn primary" style="margin-top:14px">' + (last ? "See results" : "Next question →") + '</button>');
    next.addEventListener("click", function () {
      if (last) { finishQuiz(); }
      else { quiz.i++; quiz.current = null; render(); }
    });
    card.appendChild(next);
  }
  root.appendChild(card);
}

function answerQuiz(correct, chosen, text) {
  var item = quiz.items[quiz.i];
  quiz.current = { correct: correct, chosen: chosen, text: text };
  quiz.answers.push({ st: item.st, correct: correct });
  item.st.attempts = item.st.attempts || [];
  item.st.attempts.push({ t: Date.now(), c: correct ? 1 : 0, q: item.q.id });
  if (item.st.attempts.length > 40) item.st.attempts = item.st.attempts.slice(-40);
  render();
}

function finishQuiz() {
  var answered = quiz.answers;
  var correct = answered.filter(function (a) { return a.correct; }).length;
  // Per-subject tally for the summary.
  var byTopic = {};
  answered.forEach(function (a) {
    var k = a.st.name;
    byTopic[k] = byTopic[k] || { name: k, total: 0, correct: 0 };
    byTopic[k].total++; if (a.correct) byTopic[k].correct++;
  });
  quizResult = { total: answered.length, correct: correct, breakdown: Object.keys(byTopic).map(function (k) { return byTopic[k]; }) };
  quiz = null;
  if (answered.length) save();   // persist attempts to the cloud
  render();
}

function renderQuizResult(root) {
  var r = quizResult;
  var pct = r.total ? Math.round(r.correct / r.total * 100) : 0;
  var b = band(pct);
  var card = el('<div class="card pad" style="text-align:center"></div>');

  if (r.breakdown.length) {

    });
    card.appendChild(bd);
  }

  var btns = el('<div style="display:flex;gap:8px;justify-content:center;margin-top:20px"></div>');
  var again = el('<button class="btn primary">Practise again</button>');

  dash.addEventListener("click", function () {
    quizResult = null; currentView = "dashboard";
    document.querySelectorAll("nav.tabs button").forEach(function (x) { x.setAttribute("aria-selected", String(x.getAttribute("data-view") === "dashboard")); });
    render();
  });
  btns.appendChild(again); btns.appendChild(dash);
  card.appendChild(btns);
  root.appendChild(card);
}

/* ---------------- Question editor ---------------- */
/* Performance signals used to make AI questions bespoke to his difficulties. */
function subtopicAttemptSummary(st) {
  var att = st.attempts || [];
  if (!att.length) return null;
  var correct = att.reduce(function (a, x) { return a + (x.c ? 1 : 0); }, 0);
  return { answered: att.length, correct: correct };
}
function subtopicMissed(st, limit) {
  var byId = {};
  (st.questions || []).forEach(function (q) { byId[q.id] = q.q; });
  var seen = {}, out = [];
  var att = (st.attempts || []).slice().reverse();   // most recent first
  att.forEach(function (a) {
    if (a.c === 0 && a.q && byId[a.q] && !seen[a.q]) { seen[a.q] = 1; out.push(byId[a.q]); }
  });
  return out.slice(0, limit || 6);
}

/* Rank sub-topics he is struggling most with (engaged + lowest score first). */
function weakestSubtopics(n) {
  var list = [];
  state.subjects.forEach(function (s) {
    s.topics.forEach(function (t) {
      t.subtopics.forEach(function (st) {
        var ss = deriveStageStatus(st);
        var engaged = ss.stage !== "none" || (st.attempts || []).length > 0;
        list.push({ subject: s, topic: t, st: st, score: subtopicScore(st), engaged: engaged });
      });
    });
  });
  var eng = list.filter(function (x) { return x.engaged; });
  var pool = eng.length ? eng : list;
  pool.sort(function (a, b) { return a.score - b.score; });
  return pool.slice(0, n);
}

function aiPayloadFor(subject, topic, st, count) {
  var ss = deriveStageStatus(st);
  var statusLabel = ss.stage === "none" ? "Not started"
    : (ss.stage === "learning" ? "Learning" : "Completed") + " · " + ss.status;
  // Real school-test evidence for this topic (recency-weighted %, plus recent tests).
  var testPct = (subject && topic) ? testEvidenceForTopic(subject, topic.id) : null;
  var recentTests = [];
  if (subject) {
    recentTests = state.tests.filter(function (t) {
      return t.subjectId === subject.id && typeof t.pct === "number" &&
        (t.topicIds.length === 0 || (topic && t.topicIds.indexOf(topic.id) >= 0));
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 3).map(function (t) {
      return { name: t.name, pct: t.pct, grade: t.grade || "", scope: t.topicIds.length ? "this topic" : "whole subject" };
    });
  }
  return {
    subject: subject ? subject.name : "", board: subject ? subject.board : "",
    topic: topic ? topic.name : "", subtopic: st.name,
    targetGrade: subject ? subject.target : "", status: statusLabel, count: count,
    existing: (st.questions || []).map(function (q) { return q.q; }),
    quizScore: subtopicQuizScore(st), attempts: subtopicAttemptSummary(st), missed: subtopicMissed(st, 8),
    testEvidence: testPct, tests: recentTests
  };
}

function generateWeakSpots() {
  if (!sb) { confirmModal("Not connected", "Please refresh and sign in first.", null); return; }
  var picks = weakestSubtopics(3);
  if (!picks.length) { confirmModal("Nothing to target yet", "Add subjects and rate a few sub-topics (or take a quiz) first, so the app knows where he is struggling.", null); return; }
  var names = picks.map(function (p) { return p.st.name + " (" + p.subject.name + ")"; }).join(", ");
  confirmModal("Generate for his weakest areas?", "The app will create AI questions for: " + names + ". That is " + picks.length + " AI request" + (picks.length > 1 ? "s" : "") + ".", function () {
    runWeakSpots(picks);
  });
}
function runWeakSpots(picks) {
  var m = el('<div class="modal"><div class="m-body"><h3>Generating…</h3>' +
    '<p id="ws_msg" class="hint" style="white-space:pre-line;margin-top:6px"></p></div>' +
    '<div class="m-foot"></div></div>');
  openModal(m);
  var msgEl = m.querySelector("#ws_msg"), foot = m.querySelector(".m-foot");
  var i = 0, added = 0, lines = [];
  function paint(cur) { msgEl.textContent = lines.concat(cur ? [cur] : []).join("\n"); }
  function finish() {
    lines.push("Done — added " + added + " question" + (added === 1 ? "" : "s") + ".");
    paint();
    var ok = el('<button class="btn primary">Close</button>');
    ok.addEventListener("click", function () { closeModal(); render(); });
    foot.appendChild(ok);
  }
  function step() {
    if (i >= picks.length) { if (added) save(); finish(); return; }
    var p = picks[i];
    paint("(" + (i + 1) + "/" + picks.length + ") " + p.st.name + "…");
    sb.functions.invoke("generate-questions", { body: aiPayloadFor(p.subject, p.topic, p.st, 5) }).then(function (res) {
      var n = 0;
      if (!res.error && res.data && !res.data.error) {
        var qs = (res.data.questions || []).map(sanitizeAIQuestion).filter(Boolean);
        p.st.questions = p.st.questions || [];
        qs.forEach(function (q) { p.st.questions.push(q); });
        n = qs.length; added += n;
      }
      lines.push("✓ " + p.st.name + " — " + (n ? ("+" + n) : "none"));
      i++; step();
    }).catch(function () { lines.push("✕ " + p.st.name + " — failed"); i++; step(); });
  }
  step();
}

function sanitizeAIQuestion(q) {
  if (!q || typeof q !== "object") return null;
  var text = String(q.q || "").trim(); if (!text) return null;
  if (q.type === "mc") {
    var opts = (Array.isArray(q.options) ? q.options : []).map(function (o) { return String(o).trim(); }).filter(Boolean).slice(0, 4);
    if (opts.length < 2) return null;
    var ans = parseInt(q.answer, 10); if (isNaN(ans) || ans < 0 || ans >= opts.length) ans = 0;
    return { id: uid(), type: "mc", q: text, options: opts, answer: ans };
  }
  var a = String(q.answer || "").trim(); if (!a) return null;
  return { id: uid(), type: "short", q: text, answer: a };
}

}

/* ---------------- Modals ---------------- */
function openModal(node) {
  var mr = document.getElementById("modalRoot");
  mr.innerHTML = "";
  var overlay = el('<div class="overlay"></div>');
  overlay.appendChild(node);
  overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closeModal(); });
  mr.appendChild(overlay);
  var first = node.querySelector("input, select, textarea, button");
  if (first) first.focus();
  document.addEventListener("keydown", escClose);
}
function escClose(e) { if (e.key === "Escape") closeModal(); }
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; document.removeEventListener("keydown", escClose); }

function confirmModal(title, body, onYes) {
  var m = el('<div class="modal"><div class="m-body"><h3>' + esc(title) + '</h3>' +
    '<p class="muted" style="font-size:.9rem">' + esc(body) + '</p></div>' +
    '<div class="m-foot"></div></div>');
  var foot = m.querySelector(".m-foot");
  if (onYes) {
    var cancel = el('<button class="btn ghost">Cancel</button>');
    cancel.addEventListener("click", closeModal);
    var yes = el('<button class="btn primary">Confirm</button>');
    yes.addEventListener("click", function () { closeModal(); onYes(); });
    foot.appendChild(cancel); foot.appendChild(yes);
  } else {
    var ok = el('<button class="btn primary">OK</button>');
    ok.addEventListener("click", closeModal);
    foot.appendChild(ok);
  }
  openModal(m);
}

    '<div class="row2">' +
      '<label class="f"><span>Year group</span><input id="stu_year" value="' + esc(s.year) + '" placeholder="Year 11"></label>' +
      '<label class="f"><span>Exam season</span><input id="stu_season" value="' + esc(s.season) + '" placeholder="Summer 2026"></label>' +
    '</div>' +
    '<label class="f" style="margin-top:20px"><span>Target grades (9–1)</span></label>' +
    (state.subjects.length ? '<div style="border:1px solid var(--line);border-radius:10px;padding:8px 12px">' + targetRows + '</div>'
      : '<p class="muted" style="font-size:.85rem">Add subjects first (Subjects tab), then set their target grades here.</p>') +
    '<hr style="border:none;border-top:1px solid var(--line);margin:22px 0 0">' +
    '<button class="btn sm ghost" id="stu_resetprog" style="margin-top:14px">Reset all progress to “Not started”</button>' +
    '<p class="hint">Sets every sub-topic back to Not started yet — keeps your subjects, topics, questions and test results.</p>' +
    '<button class="btn sm ghost del" id="stu_clear" style="margin-top:8px">Clear everything (start fresh)</button>' +
    '<p class="hint">Removes all subjects, topics, questions and test results, leaving an empty tracker.</p>' +
    '</div><div class="m-foot"></div></div>');
  m.querySelector("#stu_resetprog").addEventListener("click", function () {
    closeModal();
    confirmModal("Reset all progress?", "Every sub-topic goes back to “Not started yet”. Your subjects, topics, questions and test results are kept.", function () {
      resetAllProgress();
    });
  });
  m.querySelector("#stu_clear").addEventListener("click", function () {
    closeModal();
    confirmModal("Clear everything?", "This removes all subjects, topics, questions and test results, leaving an empty tracker. This cannot be undone.", function () {
      state.subjects = []; state.tests = []; save(); render();
    });
  });
  var foot = m.querySelector(".m-foot");
  var cancel = el('<button class="btn ghost">Cancel</button>'); cancel.addEventListener("click", closeModal);
  var savb = el('<button class="btn primary">Save</button>');
  savb.addEventListener("click", function () {
    s.name = m.querySelector("#stu_name").value.trim() || "Student";
    s.year = m.querySelector("#stu_year").value.trim();
    s.season = m.querySelector("#stu_season").value.trim();
    m.querySelectorAll(".tg-input").forEach(function (inp) {
      var sub = subjectById(inp.getAttribute("data-sid"));
      if (sub) sub.target = inp.value.trim();
    });
    save(); closeModal(); render();
  });
  foot.appendChild(cancel); foot.appendChild(savb);
  openModal(m);
}

/* ---------------- App shell ---------------- */
var currentView = "dashboard";
function render() {
  document.getElementById("studentLine").textContent =
    (state.student.name.split(" ")[0] || "GCSE") + " · " + (state.student.year || "GCSE");
  var root = document.getElementById("app");
  root.innerHTML = "";
  if (currentView === "dashboard") renderDashboard(root);
  else if (currentView === "subjects") renderSubjects(root);
  else if (currentView === "tests") renderTests(root);
  else renderPractise(root);
}

document.querySelectorAll("nav.tabs button").forEach(function (b) {
  b.addEventListener("click", function () {
    currentView = b.getAttribute("data-view");
    document.querySelectorAll("nav.tabs button").forEach(function (x) {
      x.setAttribute("aria-selected", String(x === b));
    });
    window.scrollTo(0, 0);
    render();
  });
});
document.getElementById("editStudent").addEventListener("click", openStudentModal);

/* Theme toggle: cycle system → light → dark */
var themeOrder = [null, "light", "dark"];
function currentThemeIndex() {
  var t = document.documentElement.getAttribute("data-theme");
  return themeOrder.indexOf(t);
}
document.getElementById("themeToggle").addEventListener("click", function () {
  var next = themeOrder[(currentThemeIndex() + 1) % themeOrder.length];
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem(KEY + ".theme", next || ""); } catch (e) {}
});
(function () {
  try { var t = localStorage.getItem(KEY + ".theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
})();

/* ---------------- Auth screen ---------------- */
function renderAuth() {
  var root = document.getElementById("app");
  root.innerHTML = "";
  var signup = false;
  var wrap = el('<div class="auth-wrap"></div>');
  var card = el('<div class="card auth-card"></div>');
  card.appendChild(el('<div class="auth-badge"><div class="compass" aria-hidden="true"></div></div>'));
  var h = el('<h2 class="auth-title">Welcome to Revision Compass</h2>');
  var sub = el('<p class="auth-sub">Sign in to track progress and keep it in sync across every device.</p>');
  card.appendChild(h); card.appendChild(sub);
  var form = el('<form class="auth-form" novalidate></form>');
  form.appendChild(el('<label class="f"><span>Email</span><input id="au_email" type="email" autocomplete="email" placeholder="you@example.com"></label>'));
  form.appendChild(el('<label class="f"><span>Password</span><input id="au_pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>'));
  var msg = el('<p class="auth-msg" hidden></p>');
  var submit = el('<button type="submit" class="btn primary" style="width:100%;justify-content:center;margin-top:16px">Sign in</button>');
  var toggle = el('<button type="button" class="btn ghost" style="width:100%;justify-content:center;margin-top:8px">New here? Create an account</button>');
  form.appendChild(msg); form.appendChild(submit); form.appendChild(toggle);
  card.appendChild(form);
  wrap.appendChild(card);
  root.appendChild(wrap);

  if (!sb) { msg.hidden = false; msg.textContent = "Couldn't reach the sign-in service. Check your connection and refresh."; msg.style.color = "var(--r)"; }

  function setMode(s) {
    signup = s;
    h.textContent = signup ? "Create your account" : "Welcome to Revision Compass";
    submit.textContent = signup ? "Create account" : "Sign in";
    document.getElementById("au_pass").setAttribute("autocomplete", signup ? "new-password" : "current-password");
    toggle.textContent = signup ? "Already have an account? Sign in" : "New here? Create an account";
    msg.hidden = true;
  }
  function showMsg(text, ok) { msg.hidden = false; msg.textContent = text; msg.style.color = ok ? "var(--g)" : "var(--r)"; }
  toggle.addEventListener("click", function () { setMode(!signup); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!sb) return;
    var email = document.getElementById("au_email").value.trim();
    var pass = document.getElementById("au_pass").value;
    if (!email || !pass) { showMsg("Enter your email and password.", false); return; }
    if (signup && pass.length < 6) { showMsg("Password must be at least 6 characters.", false); return; }
    submit.disabled = true; submit.textContent = signup ? "Creating…" : "Signing in…";
    var done = function () { submit.disabled = false; submit.textContent = signup ? "Create account" : "Sign in"; };

    if (signup) {
      sb.auth.signUp({ email: email, password: pass, options: { emailRedirectTo: window.location.href.split("#")[0] } })
        .then(function (r) {
          if (r.error) { showMsg(r.error.message, false); }
          else if (!r.data.session) { showMsg("Account created! Check your email to confirm, then sign in.", true); setMode(false); }
          done();
        }).catch(function (err) { showMsg(err.message || "Something went wrong.", false); done(); });
    } else {
      sb.auth.signInWithPassword({ email: email, password: pass })
        .then(function (r) { if (r.error) { showMsg(r.error.message, false); done(); } /* success -> auth listener */ })
        .catch(function (err) { showMsg(err.message || "Something went wrong.", false); done(); });
    }
  });
}

/* ---------------- Session lifecycle ---------------- */
function showSignedOut() {
  document.getElementById("appNav").hidden = true;
  document.getElementById("editStudent").hidden = true;
  document.getElementById("signOutBtn").hidden = true;
  document.getElementById("syncStatus").hidden = true;
  document.getElementById("studentLine").textContent = "Sign in to sync";
  renderAuth();
}
function showSignedIn() {
  document.getElementById("appNav").hidden = false;
  document.getElementById("editStudent").hidden = false;
  document.getElementById("signOutBtn").hidden = false;
  document.getElementById("syncStatus").hidden = false;
  if (state && normalizeState()) save();
  currentView = "dashboard";
  document.querySelectorAll("nav.tabs button").forEach(function (x, i) { x.setAttribute("aria-selected", String(i === 0)); });
  render();
}

function loadCloud() {
  setSync("saving");
  return sb.from("app_state").select("data").eq("user_id", userId).maybeSingle()
    .then(function (res) {
      if (res.error) throw res.error;
      if (res.data && res.data.data && res.data.data.subjects) {
        state = res.data.data; writeCache(); setSync("synced"); return;
      }
      // First time on this account — migrate a Phase-1 local copy if present, else seed.
      var legacy = null;
      try { var r = localStorage.getItem(KEY); if (r) legacy = JSON.parse(r); } catch (e) {}
      state = (legacy && legacy.subjects) ? legacy : (readCache() || emptyState());
      writeCache(); pushCloud();   // create the cloud row
    })
    .catch(function () {
      // Offline / error — fall back to this device's cache (or seed) and sync later.
      state = readCache() || emptyState();
      setSync("offline");
    });
}

function handleSession(session) {
  if (session && session.user) {
    if (authedId === session.user.id) return;   // already handled
    authedId = session.user.id;
    userId = session.user.id;
    loadCloud().then(showSignedIn);
  } else {
    authedId = null; userId = null; state = null;
    quiz = null; quizResult = null;
    showSignedOut();
  }
}

document.getElementById("signOutBtn").addEventListener("click", function () {
  if (sb) sb.auth.signOut();   // auth listener will show the signed-out screen
});

/* Boot */
if (sb) {
  sb.auth.onAuthStateChange(function (_event, session) { handleSession(session); });
  sb.auth.getSession().then(function (r) { handleSession(r.data ? r.data.session : null); });
} else {
  showSignedOut();
}
</script>
